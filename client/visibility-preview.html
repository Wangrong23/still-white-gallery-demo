<!doctype html><html><head><style>body{margin:0}nav{position:fixed;background:white;z-index:2;padding:12px}canvas{width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script></head><body><nav><a href="?role=killer">Self</a> / <a href="?role=detective">Opponent</a> <span id="status"></span></nav><canvas></canvas><script type="module">
import * as T from 'three';import {Gallery} from './scene.js';import {Game} from '../shared/game.js';
const v=new Gallery(document.querySelector('canvas')),g=new Game(),role=new URLSearchParams(location.search).get('role')||'killer';g.phase('DAY');g.state.dayTime=0;
const p=g.state.players.killer;Object.assign(p,{x:0,z:0,still:true,breath:.08});g.input('killer',{breath:true});
